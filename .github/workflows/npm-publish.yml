# Publishes the npm package when the Hub's Publish bumps package.json.
# First publish: an NPM_TOKEN repository secret. After that, npm Trusted Publishing (OIDC) for this workflow;
# then the secret can be deleted. Written by the BKSTG Hub; edits here are kept unless the Hub rewrites them.
name: Publish to npm
on:
  push:
    branches: [main]
    paths: [package.json]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
